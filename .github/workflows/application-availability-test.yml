name: Application Availability Test

on:
  pull_request:

jobs:
  availability-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start application
        run: docker compose up -d --build

      - name: Test frontend
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo "Frontend is healthy"
              exit 0
            fi
            echo "Frontend not ready, retrying..."
            sleep 2
          done

          echo "Frontend health check failed"
          exit 1

      - name: Test backend
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:9000/healthz; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Backend not ready, retrying..."
            sleep 2
          done

          echo "Backend health check failed"
          exit 1

      - name: Stop application
        if: always()
        run: docker compose down