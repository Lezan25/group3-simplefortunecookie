apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v1
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
        - name: backend
          image: aljazkni/simplefortunecookie-backend:v1
          ports:
            - containerPort: 9000
          env:
            - name: REDIS_DNS
              value: "redis://redis:6379"